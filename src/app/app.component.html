
<!-- 1) string interpolation -->
<h1 class = "text-center bg-primary text-white p-2">String Interpolation</h1>

<h1>My Name is {{name}}</h1>
<h2 class = "mb-5">i am {{age}} years old</h2>



<!-- 2) Property Binding  -->
 <h1 class = "text-center bg-primary text-white p-2">Property Binding</h1>

<img [src] = "imgUrl" alt = "angular img">

<br><br>

<button [disabled] class = "btn btn-primary m-5" [disabled] = "isDisabled">Submit</button>




<!-- 3) Event-Binding -->
 <h1 class = "text-center bg-primary text-white p-2">Event Binding</h1>

<button class = "btn btn-success" (click) = "onClick()">Click Me</button>
